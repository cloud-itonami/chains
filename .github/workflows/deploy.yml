name: Publish gh-pages

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: Publish the site built from master to gh-pages
        type: boolean
        required: true
        default: false

permissions: {}

concurrency:
  group: publish-gh-pages
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'cloud-itonami/chains' && github.ref == 'refs/heads/master' && inputs.confirm_publish
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml

  deploy:
    needs: prepare
    if: github.event_name == 'workflow_dispatch' && github.repository == 'cloud-itonami/chains' && github.ref == 'refs/heads/master' && inputs.confirm_publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: website
          path: ${{ runner.temp }}

      - name: Extract the site from this run
        run: |
          mkdir -p site-to-publish
          tar -xzf "$RUNNER_TEMP/website.tar.gz" -C site-to-publish
          test -f site-to-publish/.nojekyll
          test -f site-to-publish/index.html

      - name: Publish the static site
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: site-to-publish
